[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "search-demand-forecasting"
dynamic = ["version"]
description = "Two-stage (reveal-curve + LightGBM) forecasting of future demand from partially observed search logs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maryam Maghsoudi" }]
keywords = [
    "demand-forecasting",
    "time-series",
    "censored-data",
    "lightgbm",
    "wape",
    "short-term-rental",
    "persian-calendar",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.1",
    "lightgbm>=4.0",
    "convertdate>=2.4",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "matplotlib>=3.7",
]

[project.scripts]
demand-forecast = "demand_forecasting.cli:main"

[tool.setuptools.dynamic]
version = { attr = "demand_forecasting.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
demand_forecasting = ["resources/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: end-to-end tests that train a model (a few seconds each)"]
filterwarnings = ["error::FutureWarning", "error::DeprecationWarning:demand_forecasting.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = ["RUF005"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
